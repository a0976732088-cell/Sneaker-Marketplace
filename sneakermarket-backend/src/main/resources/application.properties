# ============================================================
# SneakerMarket Backend 共用設定
# ============================================================

# 專案名稱
spring.application.name=sneakermarket-backend

# 後端服務 Port；若環境變數 SERVER_PORT 未設定，預設使用 8080
server.port=${SERVER_PORT:8080}


# 預設使用 local 開發環境；正式部署時可改成 production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ------------------------------------------------------------
# Session Cookie 基本設定
# ------------------------------------------------------------
# 若未來會員系統最後完全採 JWT 且不使用 Server Session，這組設定可再移除。

# Session Cookie 名稱，避免使用預設 JSESSIONID 時較難辨識
server.servlet.session.cookie.name=SNEAKERMARKET_SESSION

# HttpOnly=true：前端 JavaScript 無法直接讀取 Session Cookie，可降低 XSS 竊取風險
server.servlet.session.cookie.http-only=true

# secure 依不同環境設定：local=false、production=true

# ------------------------------------------------------------
# 檔案上傳限制
# ------------------------------------------------------------
# 商品與競標商品會上傳圖片，因此不沿用老師範例的 10KB / 100KB 限制。

# 單一檔案最大 5MB
spring.servlet.multipart.max-file-size=5MB

# 單次 Request 所有檔案與表單資料合計最大 100MB
spring.servlet.multipart.max-request-size=100MB

# ------------------------------------------------------------
# 前端 CORS
# ------------------------------------------------------------
# Vue / Vite 開發伺服器預設為 http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------
# JPA / Hibernate 共用設定
# ------------------------------------------------------------
# Java camelCase 自動對應資料庫 snake_case
# 例如 createdAt -> created_at、currentPrice -> current_price
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# 關閉 Open Session in View，避免 Controller / JSON 序列化階段才偷偷查資料庫
spring.jpa.open-in-view=false

# 競標生命週期：每筆交易仍以 AuctionTime 判斷實際時間。
auction.lifecycle.enabled=${AUCTION_LIFECYCLE_ENABLED:true}
auction.lifecycle.cron=${AUCTION_LIFECYCLE_CRON:*/10 * * * * *}

# 競標訂單：獨立消費已提交的 SOLD Result，失敗由下一輪重試。
auction.order.enabled=${AUCTION_ORDER_ENABLED:true}
auction.order.cron=${AUCTION_ORDER_CRON:*/10 * * * * *}
auction.order.payment-timeout-hours=${AUCTION_ORDER_PAYMENT_TIMEOUT_HOURS:24}
auction.order.payment-deadline.cron=${AUCTION_ORDER_PAYMENT_DEADLINE_CRON:*/10 * * * * *}

# 活動提醒排程
notification.event-reminder.enabled=${EVENT_REMINDER_ENABLED:true}

# 每分鐘第 0 秒執行
notification.event-reminder.cron=${EVENT_REMINDER_CRON:0 * * * * *}
# ============================================================
# Auction Email - 共用設定
# ============================================================

# Email 功能預設關閉。
# 各環境必須明確設定 AUCTION_EMAIL_ENABLED=true 才會啟用。
auction.email.enabled=${AUCTION_EMAIL_ENABLED:false}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}

# Recovery Scheduler 預設不頻繁執行。
# 避免開發／測試環境啟用 Email 後立即補寄歷史資料。
#
# 正式環境若確認資料與 SMTP 無誤，
# 再透過環境變數設定：
# AUCTION_EMAIL_CRON=*/30 * * * * *
# AUCTION_EMAIL_CRON=0 0 0 1 1 *
#秒：0，在每分鐘第 0 秒執行
#分：*，每一分鐘
#時：*，每一小時
#日：*，每一天
#月：*，每一個月
#星期：*，每個星期幾
## 每 10 秒
#notification.email.cron=*/10 * * * * *
## 每 30 秒
#notification.email.cron=*/30 * * * * *
## 每分鐘第 0 秒
#notification.email.cron=0 * * * * *
## 每 5 分鐘
#notification.email.cron=0 */5 * * * *
## 每小時整點
#notification.email.cron=0 0 * * * *
## 每天上午 9 點
#notification.email.cron=0 0 9 * * *
auction.email.cron=${AUCTION_EMAIL_CRON:0 0 0 1 1 *}
notification.email.cron=${NOTIFICATION_EMAIL_CRON:0 * * * * *}

# Email 寄送失敗最多重試 3 次。
auction.email.max-retries=${AUCTION_EMAIL_MAX_RETRIES:3}
notification.email.from=${MAIL_FROM:}

# 寄件者地址。
# local Gmail 測試與 production 均建議由環境變數 MAIL_FROM 覆蓋。
auction.email.from=${MAIL_FROM:no-reply@sneakermarket.local}

# Email 中產生前端網址使用。
# local 可由 application-local.properties 提供 localhost；
# production 必須設定正式網站網址。
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}


# ============================================================
# SMTP 共用設定
# ============================================================

# SMTP 有限等待，避免單封 Email 長時間占住
# Email Log Transaction 或 Recovery Scheduler。
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# 通知發送批次處理
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ------------------------------------------------------------
# Redis 通知工作佇列
# ------------------------------------------------------------
# 不使用就開這個 true開 false關
notification.redis.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3s

notification.redis.stream-key=notification-send-jobs
notification.redis.consumer-group=notification-workers
notification.redis.consumer-name=${NOTIFICATION_CONSUMER_NAME:worker-1}

# Redis Worker 每隔幾毫秒檢查一次新任務
notification.redis.poll-delay-ms=1000


# ------------------------------------------------------------
# Google Calendar
# ------------------------------------------------------------

# 預設關閉，設定完成後再以環境變數開啟。
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}

google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}

google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/google/callback}

# 必須是 Base64 編碼的 32-byte AES key。
google.calendar.token-encryption-key=${GOOGLE_CALENDAR_TOKEN_KEY:}
