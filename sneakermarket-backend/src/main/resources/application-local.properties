# ============================================================
# SneakerMarket Backend - 本機開發環境設定
# ============================================================

# ------------------------------------------------------------
# Session Cookie
# ------------------------------------------------------------
# 本機通常使用 http://localhost，因此 secure 暫時設為 false。
# 未來正式環境使用 HTTPS 時，production 設定會改為 true。
server.servlet.session.cookie.secure=false

# ------------------------------------------------------------
# Microsoft SQL Server 連線設定
# ------------------------------------------------------------

# MSSQL JDBC Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 預設連線本機 SQL Server 1433 Port，資料庫名稱固定為 SneakerMarketDB
# trustServerCertificate=true 適合本機開發；正式環境應使用可信任憑證。
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SneakerMarketDB;encrypt=true;trustServerCertificate=true}

# 本機預設 SQL Server 帳號可使用 sa
spring.datasource.username=${DB_USERNAME:sa}

# 密碼不要直接寫死進 Git，請在 IDE Run Configuration 或系統環境變數設定 DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------

# 明確指定 SQL Server 方言；新版 Hibernate 通常可自動判斷，但開發階段保留沒有問題。
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 開發階段將 Hibernate 執行的 SQL 印在 Console，方便除錯
spring.jpa.show-sql=true

# 將 Console 中的 SQL 自動排版，方便閱讀
spring.jpa.properties.hibernate.format_sql=true

# BASE / 初期開發階段暫時使用 update：Entity 增加欄位時 Hibernate 可協助調整本機資料表。
# 等五人資料表正式穩定後，建議改為 validate，並改用 database/migration SQL 管理變更。
spring.jpa.hibernate.ddl-auto=update

# ------------------------------------------------------------
# Spring Mail 預留設定（競標結束 Email）
# ------------------------------------------------------------
# 尚未實作寄信時可維持預設值；正式串 SMTP 再設定環境變數。
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}



# ------------------------------------------------------------
# 競標圖片儲存
# ------------------------------------------------------------

# 競標圖片本機儲存位置。
# 相對路徑會以 Spring Boot 啟動時的 working directory 為基準。
auction.image.upload-dir=${AUCTION_IMAGE_UPLOAD_DIR:uploads/auctions}


# ------------------------------------------------------------
# Auction Session
# ------------------------------------------------------------
# 使用會員模組 Session.memberId (Long)，不再提供固定會員備援。
