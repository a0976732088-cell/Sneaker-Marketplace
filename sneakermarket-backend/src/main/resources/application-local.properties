# ============================================================
# SneakerMarket Backend - 本機開發環境設定
# ============================================================

# ------------------------------------------------------------
# Session Cookie
# ------------------------------------------------------------
# 本機通常使用 http://localhost，因此 secure 暫時設為 false。
# 未來正式環境使用 HTTPS 時，production 設定會改為 true。
server.servlet.session.cookie.secure=false

# ------------------------------------------------------------
# Microsoft SQL Server 連線設定
# ------------------------------------------------------------

# MSSQL JDBC Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 預設連線本機 SQL Server 1433 Port，資料庫名稱固定為 SneakerMarketDB
# trustServerCertificate=true 適合本機開發；正式環境應使用可信任憑證。
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SneakerMarketDB;encrypt=true;trustServerCertificate=true}

# 本機預設 SQL Server 帳號可使用 sa
spring.datasource.username=${DB_USERNAME:sa}

# 密碼不要直接寫死進 Git，請在 IDE Run Configuration 或系統環境變數設定 DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------

# 明確指定 SQL Server 方言；新版 Hibernate 通常可自動判斷，但開發階段保留沒有問題。
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 開發階段將 Hibernate 執行的 SQL 印在 Console，方便除錯
spring.jpa.show-sql=true

# 將 Console 中的 SQL 自動排版，方便閱讀
spring.jpa.properties.hibernate.format_sql=true

# 所有資料表以 JPA Entity 作為 Schema 建立與維護來源。
# 本機由 Hibernate update 維護，不要求手動執行建表或 migration SQL。
spring.jpa.hibernate.ddl-auto=update

# =========================
# Auction Email
# =========================

# 競標 Email 預設停用。
# 需要測試寄信時，請在 IDE Run Configuration 或系統環境變數設定：
# AUCTION_EMAIL_ENABLED=true
auction.email.enabled=${AUCTION_EMAIL_ENABLED:false}

# 本機預設不頻繁執行 Recovery，
# 避免歷史 SOLD / UNSOLD 測試資料被大量補寄到真實 Gmail。
#
# 若要專門測試 Email Retry / Recovery，再暫時設定：
# AUCTION_EMAIL_CRON=*/30 * * * * *
# AUCTION_EMAIL_CRON=0 0 0 1 1 *
auction.email.cron=${AUCTION_EMAIL_CRON:0 0 0 1 1 *}

# Email 最大失敗寄送次數。
# 預設失敗 3 次後停止自動重試。
auction.email.max-retries=${AUCTION_EMAIL_MAX_RETRIES:3}

# 寄件者 Email。
# Gmail 測試時，MAIL_FROM 建議與 MAIL_USERNAME 使用相同 Gmail 帳號。
auction.email.from=${MAIL_FROM:no-reply@sneakermarket.local}

# Email 內競標詳細頁、我的刊登、競標訂單等連結使用的前端網址。
# 正式部署時以 FRONTEND_BASE_URL 覆蓋。
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}


# =========================
# Spring Mail / Gmail SMTP
# =========================

# 團隊本機 Email 測試統一使用 Gmail SMTP。
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# Gmail 帳號與 App Password 不可寫死在 properties 或提交至 Git。
# 每位開發者請透過 IDE Run Configuration 或系統環境變數自行設定。
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Gmail SMTP 需要帳號驗證。
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}

# Gmail Port 587 使用 STARTTLS。
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true

# 是否印出 SMTP 通訊細節到 Console，用於除錯寄信問題。
# 預設關閉；需要除錯時在 IDE Run Configuration 或系統環境變數設定 MAIL_DEBUG=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# 避免 Gmail SMTP 無回應時長時間阻塞 Email 工作。
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

